[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "forbid-new-submodules" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key", exclude = "^(test/|src/ui/templates/admin/settings/(apple|google)-wallet\\.tsx$)" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "repomix"
name = "repomix"
entry = "repomix --quiet --output repomix-output.xml"
language = "system"
pass_filenames = false
always_run = true
