name: PR checks

# Typecheck, lint and test inside the dev image, and build and check the prod
# image without pushing it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINER_ENGINE: docker

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.dev
          load: true
          tags: tickets-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true
      - name: Cache Deno downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Typecheck
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev deno task typecheck
      - name: Biome
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev deno task lint:ci

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.dev
          load: true
          tags: tickets-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true
      - name: Cache Deno downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Test suite
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev scripts/test.sh

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build the prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: tickets-check
          cache-from: type=gha,scope=prod-amd64
          cache-to: type=gha,mode=max,scope=prod-amd64,ignore-error=true
      - name: Verify the image boots and serves
        env:
          CONTAINER_IMAGE: tickets-check
        run: scripts/container-check.sh
