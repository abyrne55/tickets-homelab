name: PR checks

# Typecheck, lint and test inside the dev image, and build and check the prod
# image without pushing it. Each job runs only when files it depends on have
# changed (a skipped job counts as passing for required checks). A manual
# run always runs everything.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINER_ENGINE: docker

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code }}
      image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'deno.json'
              - 'deno.lock'
              - 'biome.json'
              - 'Containerfile.dev'
              - 'dev'
              - '.github/workflows/pr.yml'
            image:
              - 'src/**'
              - 'scripts/**'
              - 'deno.json'
              - 'deno.lock'
              - 'Containerfile'
              - '.dockerignore'
              - '.github/workflows/pr.yml'

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.dev
          load: true
          tags: tickets-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true
      - name: Cache Deno downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Typecheck
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev deno task typecheck
      # Call the image's pinned biome directly. With a fresh Deno cache,
      # `deno task lint:ci` resolves to a broken npm copy (2.4.8).
      - name: Biome
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev biome check --error-on-warnings src test scripts

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile.dev
          load: true
          tags: tickets-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true
      - name: Cache Deno downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-
      - name: Test suite
        run: DEV_DENO_DIR="$RUNNER_TEMP/deno-dir" ./dev scripts/test.sh

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: tickets-check
          cache-from: type=gha,scope=prod-amd64
          cache-to: type=gha,mode=max,scope=prod-amd64,ignore-error=true
      - name: Verify the image boots and serves
        env:
          CONTAINER_IMAGE: tickets-check
        run: scripts/container-check.sh
